[package]
name = "nu_plugin_graphrag"
version = "0.1.0"
edition = "2024"
description = "Nushell plugin for graphrag-rs: add to and browse the one-graph memory"
license = "MIT"

[[bin]]
name = "nu_plugin_graphrag"
path = "src/main.rs"

[dependencies]
graphrag-core = { path = "../graphrag-core" }
nu-plugin = "0.116"
nu-protocol = "0.116"
serde_json = "1.0"
dirs = "5.0"
