[package]
name = "graphrag-py"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Python bindings for the graphrag top-level surface"

[lib]
name = "graphrag"
crate-type = ["cdylib"]
path = "src/lib.rs"

[features]
# This crate exists only to be imported by CPython, so building it as an
# extension module is the default: Python symbols resolve at load time instead
# of linking libpython, which is what lets `cargo build --workspace` succeed on
# a machine with no linkable libpython. Opt out only to embed an interpreter.
default = ["extension-module"]
extension-module = ["pyo3/extension-module"]

[build-dependencies]
pyo3-build-config = "0.29"

[dependencies]
graphrag-core = { path = "../graphrag-core", features = ["embeddings"] }
graphrag-llm = { path = "../graphrag-llm" }
pyo3 = { version = "0.29" }
serde_json = "1.0"
