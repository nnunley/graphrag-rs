[package]
name = "graphrag-core"
version = "0.1.0"
edition = "2024"
description = "GraphRAG core library - knowledge graph with exact vector search and community detection"
license = "MIT"

[lib]
name = "graphrag_core"
path = "src/lib.rs"

[features]
default = ["embeddings", "chunking"]
embeddings = ["fastembed"]
embeddings_remote = ["reqwest", "tokio"]
chunking = ["text-splitter"]
code = ["text-splitter/code", "tree-sitter-rust", "tree-sitter-python", "tree-sitter-javascript", "tree-sitter-typescript", "tree-sitter-go", "tree-sitter-c", "tree-sitter-cpp"]

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
dirs = "5.0"

# Lexical retrieval (BM25 over an in-memory inverted index).
# Path deps point at the local leit workspace; switch to a versioned crate
# (or git rev) when leit publishes.
leit_core = { path = "/Users/ndn/development/leit/crates/leit_core" }
leit_text = { path = "/Users/ndn/development/leit/crates/leit_text" }
leit_index = { path = "/Users/ndn/development/leit/crates/leit_index" }
leit_score = { path = "/Users/ndn/development/leit/crates/leit_score" }
leit_fusion = { path = "/Users/ndn/development/leit/crates/leit_fusion" }
fastembed = { version = "4", optional = true }
text-splitter = { version = "0.29", features = ["markdown"], optional = true }
reqwest = { version = "0.12", features = ["json", "blocking"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros"], optional = true }

# Tree-sitter parsers for code chunking
tree-sitter-rust = { version = "0.23", optional = true }
tree-sitter-python = { version = "0.23", optional = true }
tree-sitter-javascript = { version = "0.23", optional = true }
tree-sitter-typescript = { version = "0.23", optional = true }
tree-sitter-go = { version = "0.23", optional = true }
tree-sitter-c = { version = "0.23", optional = true }
tree-sitter-cpp = { version = "0.23", optional = true }

[dev-dependencies]
tempfile = "3"
