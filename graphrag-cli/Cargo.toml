[package]
name = "graphrag-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "graphrag"
path = "src/main.rs"

[dependencies]
graphrag-core = { path = "../graphrag-core", features = ["embeddings"] }
clap = { version = "4", features = ["derive"] }
dirs = "5"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
