[package]
name = "graphrag-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "graphrag"
path = "src/main.rs"

[dependencies]
graphrag-core = { path = "../graphrag-core", features = ["embeddings", "embeddings_remote"] }
graphrag-llm = { path = "../graphrag-llm" }
clap = { version = "4", features = ["derive"] }
serde_json = "1.0"
dirs = "5"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
serde_json = "1"
